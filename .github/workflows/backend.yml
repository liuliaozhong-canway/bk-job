# This is a basic workflow to help you get started with Actions

name: Backend CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
    paths:
      - 'src/backend/**'
  pull_request:
    branches: [ master, 3.*, tenant-dev-llz-test ]
    paths:
      - 'src/backend/**'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains two jobs called "buildCE" and "buildEE"
  buildCE:
    # 固定 Ubuntu 22.04: 嵌入式 MongoDB 4.0.0 通用二进制需要与 glibc/libssl 版本兼容
    runs-on: ubuntu-22.04

    container:
      image: docker-bkrepo.cwoa.net/h536b8/job_image_dev/bkjob/job-build-tool:1.0.0

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: init mysql
        working-directory: support-files/sql
        run: |
          start-mysql
          export MYSQL_PWD="${MYSQL_PASSWORD}"
          for i in */*.sql; do
            echo "${i}"
            /usr/local/mysql/bin/mysql -h127.0.0.1 -P${MYSQL_PORT} -u${MYSQL_USER} < "${i}"
          done
          unset MYSQL_PWD
      - name: Gradle Build
        working-directory : src/backend
        run: |
          ./gradlew clean build \
            -DmysqlURL=127.0.0.1:${MYSQL_PORT} \
            -DmysqlUser=${MYSQL_USER} \
            -DmysqlPasswd=${MYSQL_PASSWORD} \
            -DmavenRepoUrl="https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" \
            --info --stacktrace
